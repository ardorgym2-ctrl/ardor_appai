<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>ARDOR</title>
<meta name="theme-color" content="#955C3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARDOR">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" id="mf" href="/manifest.webmanifest">
<script>
  window.ARDOR_STAFF_SITE = /\/staff(\.html)?\/?$/.test(location.pathname);
  if (window.ARDOR_STAFF_SITE) document.getElementById('mf').href = '/manifest-staff.webmanifest';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>
:root{
  --bg:#F7F1E8; --card:#FFFDF9; --brown:#955C3E; --brown2:#B57A57; --brown-l:#F1E3D6;
  --ink:#3B2A20; --mute:#8C7B6E; --line:#E7DCCD; --ok:#5E8B5A; --warn:#C9822B; --bad:#B4473A;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
#app.wide{max-width:760px}
.logo{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.18em;color:var(--brown)}
h1,h2,h3,.serif{font-family:'Gowun Batang',serif;font-weight:700;margin:0}
h2{font-size:19px} h3{font-size:16px}
.mute{color:var(--mute)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hdr{position:sticky;top:0;z-index:20;background:rgba(247,241,232,.96);backdrop-filter:blur(6px);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.hdr .logo{font-size:20px}
.iconbtn{border:0;background:none;font-size:20px;padding:6px;cursor:pointer;color:var(--brown)}
.page{padding:4px 14px calc(96px + var(--safe-b))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.tight{padding:10px 12px}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--brown);color:#fff;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--brown-l);color:var(--brown)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{width:auto;padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.lbl{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--brown2)}
textarea.inp{min-height:64px;resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}
.chk input{margin-top:4px;accent-color:var(--brown)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b));z-index:30}
.tabbar button{flex:1;border:0;background:none;padding:4px 0;font-size:11.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabbar button .ic{font-size:19px;filter:grayscale(1);opacity:.7}
.tabbar button.on{color:var(--brown);font-weight:700}
.tabbar button.on .ic{filter:none;opacity:1}
.datestrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;position:relative;scroll-behavior:smooth}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 0;text-align:center;cursor:pointer}
.dchip .d{font-size:16px;font-weight:700}.dchip .w{font-size:11px;color:var(--mute)}
.dchip.on{background:var(--brown);border-color:var(--brown);color:#fff}.dchip.on .w{color:#f3e3d6}
.dchip.lock{opacity:.55}
.dchip .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);margin:2px auto 0;visibility:hidden}
.dchip.has .dot{visibility:visible}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--brown-l);color:var(--brown);white-space:nowrap}
.badge.pub{background:#E5EEF4;color:#36658A}.badge.user{background:#EFE9F5;color:#6B4C8C}.badge.ai{background:#FFF1DA;color:#9A6514}.badge.label{background:#E6F1E4;color:#3F7039}
.badge.bad{background:#F8E1DE;color:var(--bad)}.badge.warn{background:#FCEBD5;color:var(--warn)}.badge.ok{background:#E6F1E4;color:var(--ok)}
.seg{display:flex;background:var(--brown-l);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;cursor:pointer;color:var(--brown);font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
.faces{display:flex;justify-content:space-between;gap:4px}
.faces button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;font-size:24px;cursor:pointer;line-height:1.2}
.faces button small{display:block;font-size:10.5px;color:var(--mute)}
.faces button.on{border-color:var(--brown);background:var(--brown-l)}
.bar{height:8px;background:var(--brown-l);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);border-radius:8px}
.bar.over i{background:var(--warn)}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:0}
.x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.chip.l1{background:#FCEBD5;border-color:#E9C58F}.chip.l2{background:#F6CFA0;border-color:#E0A25A}.chip.l3{background:#E79C8F;border-color:#C9665A;color:#fff}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos .ph{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#eee}
.photos .ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .ph .x{position:absolute;top:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:13px;border-radius:0 0 0 8px;padding:1px 6px}
.photos .ph .tag{position:absolute;left:0;bottom:0;background:rgba(149,92,62,.85);color:#fff;font-size:10px;padding:0 5px;border-radius:0 6px 0 0}
.ov{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-b))}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(59,42,32,.92);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:90%;text-align:center}
.banner{background:linear-gradient(135deg,#955C3E,#B57A57);color:#fff;border-radius:16px;padding:13px 14px;margin:10px 0}
.banner .t{font-family:'Gowun Batang',serif;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer}
.kpi b{display:block;font-size:20px;color:var(--brown)}.kpi span{font-size:11.5px;color:var(--mute)}
.kpi.on{border-color:var(--brown);background:var(--brown-l)}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:7px 0;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--brown-l);color:var(--brown);display:flex;align-items:center;justify-content:center;font-family:'Gowun Batang',serif;font-weight:700;flex:0 0 36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat{background:var(--brown-l);border-radius:12px;padding:8px 10px}
.stat .v{font-weight:700;font-size:16px}.stat .k{font-size:11.5px;color:var(--mute)}
.wrow{display:grid;grid-template-columns:1fr 64px 58px 50px 26px;gap:5px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.wrow input{padding:8px 6px;text-align:center}
.wrow .nm{font-size:14px;line-height:1.25}
.wrow.head{border-top:0;font-size:11.5px;color:var(--mute);text-align:center;padding:0}
.notice{font-size:12px;color:var(--mute);background:var(--brown-l);border-radius:10px;padding:8px 10px;margin:8px 0}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--brown-l);border-top-color:var(--brown);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.auth{padding:48px 22px 40px}
.auth .logo{font-size:34px;text-align:center;display:block}
.auth .sub{text-align:center;color:var(--mute);font-family:'Gowun Batang',serif;margin:4px 0 26px}
a{color:var(--brown)}
.link{background:none;border:0;color:var(--brown);text-decoration:underline;cursor:pointer;padding:4px}
.fbx{background:#FFF8EF;border-left:3px solid var(--brown2);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:13.5px}
.aiprev{width:100%;max-height:170px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line)}
.aiitem{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0}
.aiitem select{width:100%}
.nut{font-size:12.5px;color:var(--mute)}
.nut b{color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:16px 0;font-size:14px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:95;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:96%;max-height:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
// ================= 기본 설정 =================
var CFG = window.ARDOR_CONFIG || {};
var STAFF_SITE = !!window.ARDOR_STAFF_SITE;
var DOMAIN = CFG.EMAIL_DOMAIN || 'ardor.app';
var app = document.getElementById('app');

if (!window.supabase || !CFG.SUPABASE_URL || /YOUR-PROJECT/.test(CFG.SUPABASE_URL)) {
  app.innerHTML = '<div class="auth"><span class="logo">ARDOR</span><p class="sub">설정이 필요해요</p>' +
    '<div class="card small">config.js에 Supabase 주소와 키를 넣어 주세요. (인터넷 연결도 확인해 주세요)</div></div>';
  return;
}

var keepLogin = function () { return localStorage.getItem('ardor_keep') !== '0'; };
var authStorage = {
  getItem: function (k) { return localStorage.getItem(k) || sessionStorage.getItem(k); },
  setItem: function (k, v) { if (keepLogin()) { localStorage.setItem(k, v); sessionStorage.removeItem(k); } else { sessionStorage.setItem(k, v); localStorage.removeItem(k); } },
  removeItem: function (k) { localStorage.removeItem(k); sessionStorage.removeItem(k); }
};
var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
  auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, storageKey: 'ardor-auth' }
});

// ================= 도우미 =================
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function todayKey() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function addDays(key, n) { var d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayDiff(a, b) { return Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5); }
var WD = ['일', '월', '화', '수', '목', '금', '토'];
function wd(key) { return WD[new Date(key + 'T00:00:00Z').getUTCDay()]; }
function md(key) { return Number(key.slice(5, 7)) + '/' + Number(key.slice(8, 10)); }
function canEdit(key) { var d = dayDiff(todayKey(), key); return d >= 0 && d <= 6; }
function n0(v) { var x = Number(v); return isFinite(x) ? x : 0; }
function nz(v) { return v === '' || v == null || !isFinite(Number(v)) ? null : Number(v); }
function r0(v) { return Math.round(n0(v)); }
function r1(v) { return Math.round(n0(v) * 10) / 10; }
var toastT;
function toast(msg) {
  var t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT);
  toastT = setTimeout(function () { t.style.display = 'none'; }, 2600);
}
function sheet(html, onClose) {
  closeSheet();
  var ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = '<div class="sheet" id="sheet"><div class="grab"></div>' + html + '</div>';
  ov.addEventListener('click', function (e) { if (e.target === ov) closeSheet(); });
  ov._onClose = onClose;
  document.body.appendChild(ov);
  return $('#sheet');
}
function closeSheet() { var ov = $('#ov'); if (ov) { var f = ov._onClose; ov.remove(); if (f) f(); } }
function zoom(src) {
  var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img src="' + esc(src) + '">';
  z.addEventListener('click', function () { z.remove(); }); document.body.appendChild(z);
}
function errMsg(e) {
  var m = (e && (e.message || e.error_description || e.msg)) || String(e || '');
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  if (/JWT|session|not authenticated/i.test(m)) return '로그인이 만료됐어요. 다시 로그인해 주세요.';
  if (/row-level security|permission|forbidden/i.test(m)) return '권한이 없어요. (수정 가능한 기간은 오늘 포함 최근 7일이에요)';
  return '문제가 생겼어요: ' + m;
}
function idToEmail(id) { return String(id).trim().toLowerCase() + '@' + DOMAIN; }
var ID_RE = /^[a-z][a-z0-9_]{3,15}$/;

// 초성 검색
var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function cho(s) {
  return String(s).split('').map(function (c) { var k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join('');
}
function matchQ(name, q) { q = q.replace(/\s/g, ''); if (!q) return true; var n = name.replace(/\s/g, ''); return n.indexOf(q) >= 0 || cho(n).indexOf(q) >= 0; }

// ================= 사진 임시저장 (IndexedDB) =================
var idb = (function () {
  var dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error('no idb'));
      var r = indexedDB.open('ardor', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('photos'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn) { return open().then(function (db) { return new Promise(function (res, rej) { var t = db.transaction('photos', mode); var st = t.objectStore('photos'); var out = fn(st); t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); }; t.onerror = function () { rej(t.error); }; }); }); }
  return {
    put: function (k, v) { return tx('readwrite', function (s) { s.put(v, k); }).catch(function () {}); },
    del: function (k) { return tx('readwrite', function (s) { s.delete(k); }).catch(function () {}); },
    list: function (prefix) {
      return open().then(function (db) { return new Promise(function (res) {
        var out = []; var t = db.transaction('photos', 'readonly'); var c = t.objectStore('photos').openCursor();
        c.onsuccess = function () { var cur = c.result; if (cur) { if (String(cur.key).indexOf(prefix) === 0) out.push({ key: cur.key, blob: cur.value }); cur.continue(); } else res(out); };
        c.onerror = function () { res(out); };
      }); }).catch(function () { return []; });
    }
  };
})();

// 사진 줄이기 → JPEG Blob
function shrink(file, max, q) {
  return new Promise(function (res, rej) {
    var img = new Image(); var url = URL.createObjectURL(file);
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('사진 변환 실패')); }, 'image/jpeg', q || 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없어요')); };
    img.src = url;
  });
}
function blobToB64(b) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.readAsDataURL(b); }); }
function pickFile(cb) {
  var i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.style.display = 'none'; document.body.appendChild(i);
  i.addEventListener('change', function () { var f = i.files && i.files[0]; i.remove(); if (f) cb(f); });
  i.click();
}

// ================= 상태 =================
var S = {
  session: null, me: null, tab: 'home', date: todayKey(),
  rec: null, recDate: null, dirty: false, dbPhotos: [], draftPhotos: [], fb: [], hist: [], trainer: null,
  invite: null, inviteInfo: null, authMode: 'login', msg: ''
};
var MEALS = [['b', '아침'], ['l', '점심'], ['d', '저녁'], ['s', '간식']];
var MEAL_NAME = { b: '아침', l: '점심', d: '저녁', s: '간식', day: '하루 전체' };
var SRC = { public: ['공공데이터', 'pub'], ardor: ['아르더짐', ''], user: ['유저등록', 'user'], ai: ['AI 추정', 'ai'], label: ['성분표', 'label'] };
function srcBadge(s) { var x = SRC[s] || [s, '']; return '<span class="badge ' + x[1] + '">' + x[0] + '</span>'; }

// 초대 링크 (#j-토큰)
(function () { var m = location.hash.match(/^#j-([a-z0-9]+)/i); if (m) S.invite = m[1]; })();

// ================= 클릭 한 곳에서 처리 =================
var ACT = {};
app.addEventListener('click', handleAct);
document.addEventListener('click', function (e) { if (!app.contains(e.target)) handleAct(e); });
function handleAct(e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var name = el.getAttribute('data-act'); var fn = ACT[name];
  if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  var arg = el.getAttribute('data-arg');
  fn(arg, el, e);
}

// ================= 로그인 / 가입 =================
function setAuthMsg(m) { S.msg = m || ''; var b = $('#authmsg'); if (b) { b.textContent = S.msg; b.style.display = S.msg ? 'block' : 'none'; } }

function renderAuth() {
  app.className = '';
  var staff = STAFF_SITE;
  var last = localStorage.getItem('ardor_last_id') || '';
  var rememberOn = localStorage.getItem('ardor_remember') !== '0';
  var inv = S.inviteInfo;
  var h = '<div class="auth"><span class="logo">ARDOR</span><p class="sub">' + (staff ? '직원·관리자' : '회원 체크') + '</p>';
  if (S.invite && inv) {

function blockScreen(title, body, showLogout) {

async function afterLogin(session) {
  S.session = session;
  var me;
  try { me = await loadMe(); } catch (e) { return blockScreen('연결 문제', esc(errMsg(e)), true); }
  if (!me) return blockScreen('계정 정보 없음', '프로필이 만들어지지 않았어요. 관리자에게 문의해 주세요. (SQL 02번이 실행됐는지 확인)', true);
  S.me = me;
  var staffRole = me.role === 'staff' || me.role === 'admin';
  if (!STAFF_SITE && me.role !== 'member') {
    await sb.auth.signOut(); S.me = null; S.authMode = 'login';
    S.msg = '직원 계정이에요. 직원 페이지(' + location.origin + '/staff)로 로그인해 주세요.';
    return renderAuth();
  }
  if (STAFF_SITE && me.role === 'member') {
    await sb.auth.signOut(); S.me = null; S.authMode = 'login';
    S.msg = '회원 계정이에요. 회원 페이지(' + location.origin + '/)로 로그인해 주세요.';
    return renderAuth();
  }
  if (STAFF_SITE && me.role === 'applicant') return blockScreen('승인 대기 중', esc(me.name) + ' 선생님, 가입 신청이 접수됐어요. 관리자가 승인하면 바로 쓸 수 있어요.', true);
  if (me.role === 'rejected') return blockScreen('가입 거절', '가입 신청이 승인되지 않았어요. 관리자에게 문의해 주세요.', true);
  if (STAFF_SITE && staffRole) return Staff.start();
  return Member.start();
}

ACT.logout = async function () {

async function boot() {
  app.innerHTML = '<div class="auth center"><span class="logo">ARDOR</span><p class="sub"><span class="spin"></span></p></div>';

// ================= 공통: 영양 계산 =================
function itemN(it) {
  var f = n0(it.amt) / (n0(it.base) || 100), n = it.n || {};
  return { kcal: n0(n.kcal) * f, carb: n0(n.carb) * f, protein: n0(n.protein) * f, fat: n0(n.fat) * f };
}
function sumN(list) {
  var t = { kcal: 0, carb: 0, protein: 0, fat: 0 };
  (list || []).forEach(function (it) { var x = itemN(it); t.kcal += x.kcal; t.carb += x.carb; t.protein += x.protein; t.fat += x.fat; });
  return t;
}
function dayTot(rec) {
  var all = []; MEALS.forEach(function (m) { var ml = rec.meals && rec.meals[m[0]]; if (ml) all = all.concat(ml.items || []); });
  var t = sumN(all); return { kcal: r0(t.kcal), carb: r1(t.carb), protein: r1(t.protein), fat: r1(t.fat) };
}
function nutLine(t) { return '<b>' + r0(t.kcal) + '</b>kcal · 탄 ' + r1(t.carb) + ' · 단 ' + r1(t.protein) + ' · 지 ' + r1(t.fat) + 'g'; }
function amtLabel(it) { return (it.unit === '회' ? r1(it.amt) + '회' : r0(it.amt) + (it.unit || 'g')); }
function goalBars(t, g) {
  var rows = [['kcal', '칼로리', 'kcal'], ['carb', '탄수화물', 'g'], ['protein', '단백질', 'g'], ['fat', '지방', 'g']];
  return rows.map(function (r) {
    var v = n0(t[r[0]]), G = n0(g[r[0]]), p = G ? Math.min(100, v / G * 100) : 0;
    return '<div style="margin:7px 0"><div class="row between small"><span>' + r[1] + '</span><span class="mute">' + (r[0] === 'kcal' ? r0(v) : r1(v)) + (G ? ' / ' + G : '') + ' ' + r[2] + '</span></div>' +
      '<div class="bar' + (G && v > G * 1.1 ? ' over' : '') + '"><i style="width:' + p + '%"></i></div></div>';
  }).join('');
}
function shortText(t, g) {
  if (!g || !g.kcal) return '<p class="small mute">목표를 설정하면 부족한 양을 알려 드려요. (⚙ 설정)</p>';
  var out = [], d;
  d = g.protein - t.protein; if (g.protein && d > 3) out.push('단백질 <b>' + r0(d) + 'g</b>');
  d = g.carb - t.carb; if (g.carb && d > 10) out.push('탄수화물 <b>' + r0(d) + 'g</b>');
  d = g.fat - t.fat; if (g.fat && d > 5) out.push('지방 <b>' + r0(d) + 'g</b>');
  var k = g.kcal - t.kcal;
  var s = k >= 0 ? '목표까지 <b>' + r0(k) + 'kcal</b> 남았어요.' : '목표보다 <b>' + r0(-k) + 'kcal</b> 더 먹었어요.';
  return '<p class="small" style="margin:6px 0 0">' + s + (out.length ? ' ' + out.join(', ') + ' 더 필요해요.' : '') + '</p>';
}

// ================= 공통: 목표 설정 시트 (회원·직원 같이 씀) =================
function calcGoal(type, w, bf) {
  w = n0(w); if (!w) return null;
  var lbm = bf ? w * (1 - n0(bf) / 100) : w * 0.75;
  var tdee = (370 + 21.6 * lbm) * 1.45;
  var kcal = type === 'gain' ? tdee + 250 : type === 'keep' ? tdee : tdee - 450;
  kcal = Math.round(kcal / 10) * 10;
  var protein = Math.round(w * (type === 'gain' ? 2.0 : type === 'keep' ? 1.6 : 1.8));
  var fat = Math.round(kcal * 0.25 / 9);
  var carb = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { kcal: kcal, carb: carb, protein: protein, fat: fat };
}

    days.forEach(function (d, i) { s += '<text x="' + (pad + i * bw + bw / 2) + '" y="' + (H + 14) + '" text-anchor="middle" font-size="10" fill="#8C7B6E">' + md(d) + '</text>'; });
    s += '</svg><div class="tiny mute">선: 체중(kg) · 막대: 섭취 칼로리' + (g.kcal ? ' · 점선: 목표 ' + g.kcal + 'kcal' : '') + '</div>';
    var rows = [['단백질', function (r) { return r && r.tot && r.tot.kcal ? r0(r.tot.protein) + 'g' : '-'; }], ['수면', function (r) { return r && r.sleep != null ? r.sleep + 'h' : '-'; }],
      ['컨디션', function (r) { return r && r.cond ? FACES[r.cond - 1] : '-'; }], ['통증', function (r) { return r && r.pain_level ? PAIN_LV[r.pain_level] : '-'; }]];
    s += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;text-align:center"><tr><td></td>' + days.map(function (d) { return '<td class="mute">' + md(d) + '</td>'; }).join('') + '</tr>' +
      rows.map(function (row) { return '<tr><td class="mute" style="text-align:left;white-space:nowrap">' + row[0] + '</td>' + days.map(function (d) { return '<td style="padding:3px 0">' + row[1](D.recs[d]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
    return s;
  }

  function renderDetail() {
    var D = T.detail, m = D.m, d = D.date, r = D.recs[d], g = m.goal || {};
    var h = '<div class="hdr"><button class="btn sm line" data-act="sBack">‹ 목록</button><span class="small mute">' + esc(S.me.name) + '</span></div><div class="page" style="padding-bottom:40px">';
    h += '<div class="row" style="margin:4px 0 8px"><div class="av">' + esc((m.name || '?').slice(0, 1)) + '</div><div class="grow"><h2>' + esc(m.name) + '</h2><div class="tiny mute">' + esc(m.login_id) + ' · ' + esc(m.branch) + '점 · 담당 ' + (m.trainer_id ? esc(nameOf(m.trainer_id)) : '미지정') + '</div></div></div>';
    // 담당
    h += '<div class="row wrap" style="gap:6px">';
    if (isAdmin()) {
      h += '<select class="inp" id="s_tr" style="width:auto;flex:1"><option value="">담당 미지정</option>' + T.staff.map(function (s) { return '<option value="' + s.id + '"' + (m.trainer_id === s.id ? ' selected' : '') + '>' + esc(s.name) + ' (' + esc(s.branch) + ')</option>'; }).join('') + '</select><button class="btn sm" data-act="sAssignSel">담당 저장</button>';
    } else if (!m.trainer_id) h += '<button class="btn sm" data-act="sAssign" data-arg="me">내 회원으로 지정</button>';
    else if (m.trainer_id === S.me.id) h += '<button class="btn sm line" data-act="sAssign" data-arg="none">담당 해제</button>';
    h += '<button class="btn sm sec" data-act="sGoal">목표 설정</button></div>';
    h += '<div class="card"><h3>목표</h3><div style="margin-top:8px">' + goalSummary(g) + '</div></div>';
    if (D.intake) {
      var a = D.intake.answers || {};
      h += '<details class="card"><summary class="serif" style="font-weight:700;cursor:pointer">가입 설문</summary><div class="small" style="margin-top:6px">목표: ' + esc(a.goal || '-') + '<br>운동 경험: ' + esc(a.exp || '-') + '<br>활동량: ' + esc(a.activity || '-') + '<br>통증 이력: ' + esc(a.injury || '-') + '<br>질환·약: ' + esc(a.medical || '-') + '</div></details>';
    }
    h += '<div class="card"><h3>최근 7일</h3>' + trend(D) + '</div>';
    // 날짜
    h += '<div class="datestrip" id="sstrip">';
    for (var i = 13; i >= 0; i--) { var dd = addDays(todayKey(), -i); h += '<div class="dchip' + (dd === d ? ' on' : '') + (canEdit(dd) ? '' : ' lock') + (D.recs[dd] ? ' has' : '') + '" data-act="sDay" data-arg="' + dd + '"><div class="w">' + (i ? wd(dd) : '오늘') + '</div><div class="d">' + Number(dd.slice(8)) + '</div><div class="dot"></div></div>'; }
    h += '</div>';
    h += '<h3 style="margin:4px 0">' + md(d) + '(' + wd(d) + ') 기록 ' + (r ? (r.status === 'submitted' ? '<span class="badge ok">제출</span>' : '<span class="badge">작성 중</span>') : '<span class="badge">기록 없음</span>') + '</h3>';
    if (r) {
      h += '<div class="card"><div class="grid3">' +
        [['체중', r.weight, 'kg'], ['수면', r.sleep, '시간'], ['걸음', r.steps, '보'], ['물', r.water, 'L'], ['골격근', r.muscle, 'kg'], ['체지방', r.body_fat, '%']].map(function (x) { return '<div class="stat"><div class="k">' + x[0] + '</div><div class="v">' + (x[1] == null ? '-' : esc(x[1]) + '<span class="tiny mute"> ' + x[2] + '</span>') + '</div></div>'; }).join('') + '</div>' +
        '<div class="row wrap" style="margin-top:8px;gap:10px">' + Object.keys(SCALES).map(function (k) { return '<span class="small">' + SCALES[k][0] + ' ' + (r[k] ? FACES[r[k] - 1] + ' ' + SCALES[k][1][r[k] - 1] : '-') + '</span>'; }).join('') + '</div>' +
        '<div class="chips" style="margin-top:8px">' + ((r.pain || []).length ? r.pain.map(function (p) { var s = String(p).split(':'); return '<span class="chip l' + painLevelOf(p) + '">' + esc(s[0]) + ' · ' + esc(s[1] || '약') + '</span>'; }).join('') : '<span class="small mute">통증 없음</span>') + '</div></div>';
      var wk = r.trained === 'rest' ? '쉬는 날' : r.trained === 'pt' ? 'PT' : r.trained === 'self' ? '개인운동' : '기록 없음';
      h += '<div class="card"><h3>운동 · ' + wk + '</h3>' + ((r.workouts || []).length ? r.workouts.map(function (w) { return '<div class="item small"><span class="grow">' + esc(w.name) + ' <span class="tiny mute">' + esc(w.part || '') + '</span></span><span>' + (w.w != null ? w.w + 'kg · ' : '') + (w.reps != null ? w.reps + (w.part === '유산소' ? '분' : '회') : '') + (w.sets != null ? ' × ' + w.sets + '세트' : '') + '</span></div>'; }).join('') : '') + '</div>';
      var t = r.tot || {};
      h += '<div class="card"><div class="row between"><h3>식단</h3><span class="small">' + nutLine(t) + '</span></div>' + goalBars(t, g) + shortText({ kcal: n0(t.kcal), carb: n0(t.carb), protein: n0(t.protein), fat: n0(t.fat) }, g) + '</div>';
    }
    var meals = (r && r.meals) || {};
    MEALS.concat([['day', '하루 전체']]).forEach(function (mm) {
      var k = mm[0], ml = meals[k] || {}, items = ml.items || [];
      var phs = D.photos.filter(function (p) { return p.meal === k; });
      var fbs = D.fb.filter(function (f) { return f.record_date === d && f.meal === k; });
      if (k !== 'day' && !items.length && !phs.length && !fbs.length && !ml.memo && !canEdit(d)) return;
      h += '<div class="card"><div class="row between"><h3>' + mm[1] + '</h3>' + (k !== 'day' ? '<span class="small mute">' + r0(sumN(items).kcal) + ' kcal' + (ml.full ? ' · ' + FULL_FACE[ml.full - 1] + ' ' + FULL[ml.full - 1] : '') + '</span>' : '') + '</div>';
      if (k !== 'day') {
        h += items.length ? items.map(function (it) { var x = itemN(it); return '<div class="item small"><span class="grow">' + esc(it.name) + ' ' + srcBadge(it.src) + (it.via === 'ai' ? ' <span class="tiny mute">📷AI</span>' : '') + '</span><span class="mute">' + amtLabel(it) + ' · ' + r0(x.kcal) + 'kcal · 단' + r1(x.protein) + '</span></div>'; }).join('') : '<p class="small mute" style="margin:4px 0">기록 없음</p>';
        if (ml.memo) h += '<p class="small" style="margin:6px 0 0">📝 ' + esc(ml.memo) + '</p>';
        if (phs.length) h += '<div class="photos">' + phs.map(function (p) { return '<div class="ph"><img src="' + esc(p.url || '') + '" data-act="zoom" data-arg="' + esc(p.url || '') + '"></div>'; }).join('') + '</div>';
      }
      fbs.forEach(function (f) { h += '<div class="fbx"><div class="row between"><span>💬 <b>' + esc(nameOf(f.author_id) || '트레이너') + '</b> ' + esc(f.body) + '</span>' + (f.author_id === S.me.id ? '<button class="x" data-act="sFbDel" data-arg="' + f.id + '">×</button>' : '') + '</div></div>'; });
      if (canEdit(d)) h += '<div class="row" style="margin-top:8px"><input class="inp" id="fb_' + k + '" placeholder="' + mm[1] + ' 피드백 남기기"><button class="btn sm" data-act="sFb" data-arg="' + k + '">보내기</button></div>';
      h += '</div>';
    });
    if (!canEdit(d)) h += '<p class="notice">피드백은 오늘 포함 최근 7일 기록에만 남길 수 있어요.</p>';
    h += '<p class="notice">회원 건강 정보예요. 캡처·공유하지 마세요.</p></div>';
    app.innerHTML = h;
    var s = $('#sstrip'), c = s && $('.dchip.on', s);
    if (c) { s.style.scrollBehavior = 'auto'; var sr = s.getBoundingClientRect(), cr = c.getBoundingClientRect(); s.scrollLeft += (cr.left + cr.width / 2) - (sr.left + sr.width / 2); s.style.scrollBehavior = ''; }
  }
  ACT.sFb = async function (meal) {
    var D = T.detail, inp = $('#fb_' + meal), body = inp.value.trim(); if (!body) return;
    var r = await sb.from('feedback').insert({ member_id: D.m.id, record_date: D.date, meal: meal, author_id: S.me.id, body: body }).select().single();
    if (r.error) return toast(errMsg(r.error));
    D.fb.push(r.data); renderDetail(); toast('피드백을 남겼어요');
  };
  ACT.sFbDel = async function (id) {
    if (!confirm('이 피드백을 지울까요?')) return;
    var r = await sb.from('feedback').delete().eq('id', Number(id));
    if (r.error) return toast(errMsg(r.error));
    T.detail.fb = T.detail.fb.filter(function (f) { return String(f.id) !== String(id); }); renderDetail();
  };
  async function assign(tid) {
    var D = T.detail;
    var r = await sb.rpc('assign_trainer', { p_member: D.m.id, p_trainer: tid });
    if (r.error) return toast(errMsg(r.error));
    D.m.trainer_id = tid; toast(tid ? '담당을 지정했어요' : '담당을 해제했어요'); renderDetail();
  }
  ACT.sAssign = function (a) { if (a === 'none' && !confirm('담당을 해제할까요?')) return; assign(a === 'me' ? S.me.id : null); };
  ACT.sAssignSel = function () { assign($('#s_tr').value || null); };
  ACT.sGoal = function () {
    var D = T.detail;
    goalSheet(D.m.goal, D.m.name + '님 목표 설정', async function (g) {
      var r = await sb.rpc('set_member_goal', { p_member: D.m.id, p_goal: g });
      if (r.error) throw r.error;
      D.m.goal = g; renderDetail();
    });
  };

  // ---------- 초대 ----------
  function vInvite() {
    var h = '<div class="card"><h3>초대 링크 만들기</h3><p class="small mute">링크는 1번만 쓸 수 있고 14일 뒤 만료돼요.' + (isAdmin() ? '' : ' 내가 만든 회원 링크로 가입하면 내 회원으로 바로 지정돼요.') + '</p>';
    if (isAdmin()) h += '<label class="lbl">지점</label><select class="inp" id="inv_br"><option value="망포">망포점</option><option value="서천">서천점</option></select>';
    h += '<div class="grid2" style="margin-top:10px"><button class="btn" data-act="sInvite" data-arg="member">회원 초대 링크</button>' + (isAdmin() ? '<button class="btn sec" data-act="sInvite" data-arg="staff">직원 초대 링크</button>' : '') + '</div>';
    if (T.inviteLink) h += '<div class="card tight" style="margin-top:12px;background:var(--brown-l)"><div class="small" style="word-break:break-all" id="inv_link">' + esc(T.inviteLink) + '</div><div class="grid2" style="margin-top:8px"><button class="btn sm" data-act="sCopy">복사</button><button class="btn sm sec" data-act="sShare">공유</button></div></div>';
    h += '</div><div class="card"><h3>최근 만든 링크</h3><div id="inv_list"><p class="empty"><span class="spin"></span></p></div></div>';
    setTimeout(loadInvites, 0);
    return h;
  }
  async function loadInvites() {
    var r = await sb.from('invites').select('*').order('created_at', { ascending: false }).limit(20);
    var el = $('#inv_list'); if (!el) return;
    var now = Date.now();
    el.innerHTML = (r.data || []).length ? r.data.map(function (i) {
      var st = i.used_at ? '<span class="badge ok">사용됨</span>' : new Date(i.expires_at).getTime() < now ? '<span class="badge">만료</span>' : '<span class="badge warn">대기</span>';
      return '<div class="item small"><span class="grow">' + (i.role === 'staff' ? '직원' : '회원') + ' · ' + esc(i.branch) + '점 <span class="tiny mute">' + esc(String(i.created_at).slice(5, 10)) + '</span></span>' + st + '</div>';
    }).join('') : '<p class="empty">아직 없어요.</p>';
  }
  ACT.sInvite = async function (role) {
    var br = $('#inv_br') ? $('#inv_br').value : null;
    var r = await sb.rpc('create_invite', { p_role: role, p_branch: br });
    if (r.error) return toast(errMsg(r.error));
    T.inviteLink = location.origin + (role === 'staff' ? '/staff' : '/') + '#j-' + r.data;
    render();
  };
  ACT.sCopy = function () {
    var t = T.inviteLink;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('복사했어요'); }, function () {
      var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('복사했어요'); } catch (e) { toast('길게 눌러 복사해 주세요'); } ta.remove();
    });
  };
  ACT.sShare = function () {
    if (navigator.share) navigator.share({ title: 'ARDOR 가입 링크', text: '아르더짐 앱 가입 링크예요 (1회용)', url: T.inviteLink }).catch(function () {});
    else ACT.sCopy();
  };

  // ---------- 직원 승인 (관리자) ----------
  function vApprove() {
    var h = '<div class="card"><h3>가입 신청</h3>' + (T.applicants.length ? T.applicants.map(function (a) {
      return '<div class="item"><div class="grow"><b>' + esc(a.name) + '</b> <span class="tiny mute">' + esc(a.login_id) + ' · ' + esc(a.branch) + '점</span></div><button class="btn sm" data-act="sReview" data-arg="' + a.id + ':1">승인</button><button class="btn sm line" data-act="sReview" data-arg="' + a.id + ':0">거절</button></div>';
    }).join('') : '<p class="empty">대기 중인 신청이 없어요.</p>') + '</div>';
    h += '<div class="card"><h3>직원</h3>' + T.staff.map(function (s) { return '<div class="item small"><span class="grow">' + esc(s.name) + ' <span class="tiny mute">' + esc(s.login_id) + '</span></span><span class="mute">' + esc(s.branch) + '점 · ' + (s.role === 'admin' ? '관리자' : '직원') + '</span></div>'; }).join('') + '</div>';
    return h;
  }
  ACT.sReview = async function (a) {
    var p = a.split(':'), ok = p[1] === '1';
    if (!ok && !confirm('거절할까요?')) return;
    var r = await sb.rpc('review_staff', { p_user: p[0], p_ok: ok });
    if (r.error) return toast(errMsg(r.error));
    await loadAll(); render(); toast(ok ? '승인했어요' : '거절했어요');
  };

  // ---------- 설정 (관리자) ----------
  function vSettings() {
    return '<div class="card" id="setbox"><h3>앱 설정</h3><p class="empty"><span class="spin"></span></p></div>' +
      '<div class="notice">AI 사진 분석은 1회마다 Claude API 요금이 나가요. 하루 한도는 회원 1명 기준이에요.</div>';
  }
  async function loadSettings() {
    var r = await sb.from('app_settings').select('*');
    var v = {}; (r.data || []).forEach(function (x) { v[x.key] = x.value; });
    var el = $('#setbox'); if (!el) return;
    el.innerHTML = '<h3>앱 설정</h3>' +
      '<label class="chk"><input type="checkbox" id="st_os"' + (v.open_signup ? ' checked' : '') + '>회원 자유 가입 (초대 링크 없이 앱 주소로 가입)</label>' +
      '<label class="chk"><input type="checkbox" id="st_ss"' + (v.open_staff_signup ? ' checked' : '') + '>직원 가입 신청 받기 (/staff에서 신청 → 승인)</label>' +
      '<label class="lbl">AI 사진 분석 하루 한도 (1인당)</label><input class="inp" id="st_ai" type="number" inputmode="numeric" value="' + (v.ai_daily_limit != null ? v.ai_daily_limit : 20) + '">' +
      '<button class="btn" data-act="sSetSave" style="margin-top:12px">저장</button>';
  }
  ACT.sSetSave = async function () {
    var calls = [['open_signup', $('#st_os').checked], ['open_staff_signup', $('#st_ss').checked], ['ai_daily_limit', Math.max(0, Math.round(n0($('#st_ai').value)))]];
    for (var i = 0; i < calls.length; i++) {
      var r = await sb.rpc('set_setting', { p_key: calls[i][0], p_value: calls[i][1] });
      if (r.error) return toast(errMsg(r.error));
    }
    toast('설정을 저장했어요');
  };

  return { start: start };
})();

// ================= 시작 =================
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(function () {});
}
boot();
})();
</script>
</body>
</html>
